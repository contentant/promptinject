[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contentant-promptinject"
version = "0.1.0"
description = "扫描外部内容中的疑似指令语句，标出可能覆盖系统指令的位置。"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "contentant" }]
keywords = ["security", "prompt-injection", "llm", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://contentant.github.io"
Repository = "https://github.com/contentant/promptinject"
Issues = "https://github.com/contentant/promptinject/issues"

[project.scripts]
promptinject = "promptinject:main"

[tool.setuptools]
py-modules = ["promptinject"]
